# Hạ tầng cho môi trường phát triển: PostgreSQL + Redis (BullMQ)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pvh
      POSTGRES_PASSWORD: pvh
      POSTGRES_DB: pvh_eduagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
